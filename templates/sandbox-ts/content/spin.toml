#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "{{project-name | kebab_case}}"
version = "0.1.0"
authors = ["{{authors}}"]
description = "{{project-description}}"

# EXPERIMENTAL bundler: uses the public esm.sh by default. To self-host, see
# https://github.com/esm-dev/esm.sh/blob/main/HOSTING.md and set
# SPIN_VARIABLE_ESM_BASE_URL=https://esm.example.com
[variables]
esm_base_url = { default = "https://esm.sh" }

# This app scaffolds two PRIVATE building blocks: a JS/TS code sandbox and its dependency
# bundler. Both are private (no public route) and reachable only via service chaining from
# another component in this app. Add your own component that drives them through
# @spinframework/spin-code-sandbox (see examples/ai-code-executor), or `spin add -t sandbox-ts`
# this pair into an existing app instead. The Interpreter wiring:
#
#   const js = new Interpreter({
#     baseUrl:    "http://{{project-name | kebab_case}}.spin.internal",
#     bundlerUrl: "http://{{project-name | kebab_case}}-bundler.spin.internal",
#   });

# --- JS/TS sandbox: runs untrusted code (no esm.sh egress of its own) ---
[[trigger.http]]
route = { private = true }
component = "{{project-name | kebab_case}}"

[component.{{project-name | kebab_case}}]
# Prebuilt components from the spin-code-sandbox GitHub releases. To move to a
# newer release, update each source URL and digest.
source = { url = "https://github.com/spinframework/spin-code-sandbox/releases/download/v0.1.0/ts-sandbox.wasm", digest = "sha256:533eaa2d7d5a3318951bebd576e847740d61e89c6299129a3b754aaf04150e89" }
key_value_stores = ["default"]
# Outbound HTTP is denied until you list hosts here, e.g. ["https://api.example.com"]. Each
# request's `allowedHosts` can only narrow this list, and guard-io always refuses private and
# internal addresses.
allowed_outbound_hosts = []
[component.{{project-name | kebab_case}}.variables]
log_level = "info"

# --- Bundler (EXPERIMENTAL): fetches npm deps from esm.sh, runs no user code ---
[[trigger.http]]
route = { private = true }
component = "{{project-name | kebab_case}}-bundler"

[component.{{project-name | kebab_case}}-bundler]
source = { url = "https://github.com/spinframework/spin-code-sandbox/releases/download/v0.1.0/bundler.wasm", digest = "sha256:b4430fa74eae6d2db0f32c829ffd53472d093fb5176cb0502c90f002bf7d01d3" }
# The bundler's only egress is the esm.sh server named by esm_base_url (trusted build infra).
allowed_outbound_hosts = ["{% raw %}{{ esm_base_url }}{% endraw %}"]
[component.{{project-name | kebab_case}}-bundler.variables]
esm_base_url = "{% raw %}{{ esm_base_url }}{% endraw %}"
