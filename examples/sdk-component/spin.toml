spin_manifest_version = 2

[application]
name = "sandbox-sdk-component"
version = "0.1.0"
description = "Minimal Spin component using @spinframework/spin-code-sandbox through private interpreter components."

[[trigger.http]]
route = "/..."
component = "api"

[component.api]
source = "api/dist/api.wasm"
allowed_outbound_hosts = [
  "http://ts-sandbox.spin.internal",
  "http://py-sandbox.spin.internal",
]
[component.api.build]
command = "npm ci && npm run build"
workdir = "api"

[[trigger.http]]
route = { private = true }
component = "ts-sandbox"

[component.ts-sandbox]
source = { url = "https://github.com/spinframework/spin-code-sandbox/releases/download/v0.1.0/ts-sandbox.wasm", digest = "sha256:533eaa2d7d5a3318951bebd576e847740d61e89c6299129a3b754aaf04150e89" }
key_value_stores = ["default"]
# This example never passes allowedHosts, so its sandboxes need no outbound access. Widen this
# only together with the per-request allow-list, the guard's narrower check.
allowed_outbound_hosts = []

[[trigger.http]]
route = { private = true }
component = "py-sandbox"

[component.py-sandbox]
source = { url = "https://github.com/spinframework/spin-code-sandbox/releases/download/v0.1.0/py-sandbox.wasm", digest = "sha256:a2e5be435099a849e04242120524d937ca1411c413e32227f4d6c00f698d3a85" }
key_value_stores = ["default"]
# This example never passes allowedHosts, so its sandboxes need no outbound access. Widen this
# only together with the per-request allow-list, the guard's narrower check.
allowed_outbound_hosts = []